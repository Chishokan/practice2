<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>貸出は三日まで</title>
    <meta
      name="description"
      content="小さな港街の図書館に、あなたは司書として着任する。本を貸して、返してもらって、棚を整えて。……ただ、それだけの、静かな仕事です。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- OGP / Twitter。ジャンルは控えめに（ネタバレなし）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="貸出は三日まで" />
    <meta property="og:title" content="貸出は三日まで" />
    <meta
      property="og:description"
      content="小さな港街の図書館に、あなたは司書として着任する。本を貸して、返してもらって、棚を整えて。……ただ、それだけの、静かな仕事です。"
    />
    <!--
      og:image：既定は文字のみのフォールバック(/og.svg・常に存在)。
      D2 で cg/title.webp を配置したら、より映える PNG(1200x630) を書き出して差し替え推奨
      （X 等は SVG の OGP を弾くことがあるため。詳細は docs/DEPLOY.md）。
    -->
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="貸出は三日まで" />
    <meta
      name="twitter:description"
      content="小さな港街の図書館に、あなたは司書として着任する。本を貸して、返してもらって、棚を整えて。……ただ、それだけの、静かな仕事です。"
    />
    <meta name="twitter:image" content="/og.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
